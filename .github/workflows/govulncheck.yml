name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so a newly disclosed vulnerability in an unchanged dependency is
  # caught even when nothing has been pushed.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: 'go.mod'
          go-package: ./...
