version: 2

project_name: solidserver-mcp

# No `before` hooks on purpose. Running `go mod tidy` here would let a release
# silently rewrite go.mod and go.sum and then publish artifacts built from a
# module state that is not the tagged one. The release workflow verifies
# tidiness instead and fails if it differs.

builds:
  - main: .
    binary: solidserver-mcp
    env:
      # No cgo anywhere in the dependency tree, so a static binary keeps the
      # release usable on musl-based distros and in scratch containers.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      # Strip local filesystem paths out of the binary so builds are reproducible.
      - -trimpath
    ldflags:
      # main.version is a var precisely so the tag lands here. .Version is the
      # tag with the leading v removed.
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - '^ci:'
      - '^test:'
      - '^style:'
      - '^docs?:'
      - '^chore\(deps\): bump'

# Homebrew tap: on every tagged release, GoReleaser regenerates the formula in
# tphakala/homebrew-tap and pushes it, so the tap stays current with no manual
# steps. Auth is a scoped write deploy key (secret HOMEBREW_TAP_DEPLOY_KEY) pushed
# over SSH, not a personal access token, so its reach is limited to that one repo.
#
# Kept as a formula (`brews`), not a cask (`homebrew_casks`): Homebrew casks are
# macOS-only and solidserver-mcp ships Linux binaries too, so a formula's
# on_macos/on_linux blocks let `brew install` work on both. GoReleaser deprecated
# `brews` but it stays functional in v2, and the release job runs `release`, not
# `check`, so the deprecation only warns. Revisit if GoReleaser removes `brews` in
# a future major.
brews:
  - repository:
      owner: tphakala
      name: homebrew-tap
      branch: main
      git:
        url: "git@github.com:tphakala/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    directory: Formula
    homepage: "https://github.com/tphakala/solidserver-mcp"
    description: "Model Context Protocol (MCP) server for EfficientIP SolidServer IPAM/DNS/DHCP management"
    license: "Apache-2.0"
    test: |
      system "#{bin}/solidserver-mcp", "--version"
